spring.application.name=reservation

# SQLite database (foreign keys are disabled by default in SQLite)
spring.datasource.url=jdbc:sqlite:reservation.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite only allows one writer at a time
spring.datasource.hikari.maximum-pool-size=1

# The schema is managed by Flyway, Hibernate only checks it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
